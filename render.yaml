# Render Blueprint: New > Blueprint > pick this repo, then paste the three LiveKit values when asked.
services:
  - type: web
    name: dream11-live
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
